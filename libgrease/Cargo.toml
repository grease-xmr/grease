[package]
name = "libgrease"
version = "0.1.0"
edition = "2021"
# monero-oxide's wallet and RPC crates, and dalek-ff-group 0.5, declare this MSRV.
rust-version = "1.89"

[features]
mocks = ["rand_chacha"]
default = ["mocks"]

[dependencies]

aes-gcm = "0.10.3"
anyhow = { workspace = true }
async-trait = { workspace = true }
blake2 = { workspace = true }
chrono = { workspace = true }
curve25519-dalek = { version = "4.1.3", features = ["digest"] }
digest = "0.11"
futures = { version = "0.3.31" }
hex = { workspace = true, features = ["serde"] }
ic_bls12_381 = { version = "0.10.1", features = ["experimental"] }
ic-vetkeys = "0.8.1"
log = "0.4.27"
monero = { workspace = true }
num-bigint = { workspace = true }
num-traits = "0.2"
paste = "1.0.11"
rand_chacha = { version = "0.3.1", optional = true }
rand_core = { workspace = true }
ron = {  workspace = true }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = {workspace = true}
sha2 = "0.11"
# `ic_bls12_381`'s `ExpandMsgXmd<H>` states its bound in digest-0.10 traits, so `attestation.rs` needs a
# 0.10-generation `Sha256` for that one call. The 0.10 crate is already in the graph via `ic-vetkeys`.
sha2_010 = { package = "sha2", version = "0.10" }
subtle = "2.6.1"
tokio = { workspace = true }
thiserror = "2.0.12"
zeroize = {  workspace = true }

# Serai dependencies
ciphersuite = { workspace = true }
dalek-ff-group = { workspace = true }
flexible-transcript = { workspace = true }
modular-frost = {  workspace = true }
musig = { workspace = true }

# monero-oxide dependencies, revision-pinned at the workspace root
monero-oxide = { workspace = true }
monero-wallet = { workspace = true, features = ["multisig"] }
monero-address = { workspace = true }
monero-interface = { workspace = true }
monero-daemon-rpc = { workspace = true }
monero-simple-request-rpc = { workspace = true }

[dev-dependencies]
ark-ff = "0.5"
env_logger = "0.11.8"
futures = { version = "0.3.31", features = ["executor"] }
serde_json = { workspace = true }
static_assertions = "1.1"
tokio = { version = "1", features = ["rt", "rt-multi-thread",  "macros"] }
ark-bls12-381 = "0.5"
ark-ec = "0.5"

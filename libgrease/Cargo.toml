[package]
name = "libgrease"
version = "0.1.0"
edition = "2021"

[features]
mocks = ["rand_chacha"]
default = ["mocks"]

[dependencies]

aes-gcm = "0.10.3"
anyhow = { workspace = true }
async-trait = { workspace = true }
blake2 = { workspace = true }
chrono = { workspace = true }
curve25519-dalek = { version = "4.1.3", features = ["digest"] }
digest = "0.10.7"
futures = { version = "0.3.31" }
hex = { workspace = true, features = ["serde"] }
ic_bls12_381 = { version = "0.10.1", features = ["experimental"] }
ic-vetkeys = "0.8.1"
k256 = { version = "0.13", default-features = false, features = ["arithmetic"] }
log = "0.4.27"
monero = { workspace = true }
num-bigint = { workspace = true }
num-traits = "0.2"
paste = "1.0.11"
rand_chacha = { version = "0.3.1", optional = true }
rand_core = { workspace = true }
ron = {  workspace = true }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = {workspace = true}
sha2 = "0.10"
subtle = "2.6.1"
tokio = { workspace = true }
thiserror = "2.0.12"
zeroize = {  workspace = true }

# Serai dependencies
ciphersuite = { workspace = true }
dalek-ff-group = { workspace = true }
dleq = { workspace = true }
flexible-transcript = { workspace = true }
modular-frost = {  workspace = true }

[dependencies.monero-wallet]
version = "0.1"
git = "https://github.com/serai-dex/serai.git"
rev = "dc1b8dfccd68b7c2eb4359a1e37b55ce5e4453b5"
features = ["multisig"]

[dependencies.monero-simple-request-rpc]
version = "0.1"
git = "https://github.com/serai-dex/serai.git"
rev = "dc1b8dfccd68b7c2eb4359a1e37b55ce5e4453b5"

[dependencies.monero-serai]
version = "0.1.4-alpha"
git = "https://github.com/serai-dex/serai.git"
rev = "dc1b8dfccd68b7c2eb4359a1e37b55ce5e4453b5"

[dependencies.monero-rpc]
version = "0.1"
git = "https://github.com/serai-dex/serai.git"
rev = "dc1b8dfccd68b7c2eb4359a1e37b55ce5e4453b5"

[dev-dependencies]
ark-ff = "0.5"
env_logger = "0.11.8"
sha3 = "0.10"
futures = { version = "0.3.31", features = ["executor"] }
serde_json = { workspace = true }
static_assertions = "1.1"
tokio = { version = "1", features = ["rt", "rt-multi-thread",  "macros"] }
ark-bls12-381 = "0.5"
ark-ec = "0.5"

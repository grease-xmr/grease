[package]
name = "e2e"
version = "0.1.0"
edition = "2021"


[dependencies]
anyhow = { workspace = true }
ciphersuite = { workspace = true }
grease-cli = { version = "0.1", path = "../grease_cli" }
grease-p2p = { workspace = true }
libgrease = { workspace = true }
log = { workspace = true }
monero = { workspace = true }
rand_core = { workspace = true }
tokio = { workspace = true, features = ["full"]}

# monero-oxide dependencies, revision-pinned at the workspace root so e2e cannot drift off libgrease's pin again.
# `monero-rpc` is gone upstream: its interface half is `monero-interface`, its daemon client `monero-daemon-rpc`.
# e2e does not currently compile against the new libgrease API — these entries make it resolve, not build.
monero-address = { workspace = true }
monero-daemon-rpc = { workspace = true }
monero-interface = { workspace = true }
monero-simple-request-rpc = { workspace = true }

[dev-dependencies]
dotenvy = "0.15.0"
env_logger = "0.11.3"
cucumber = { version = "0.21.1", features = ["libtest"] }
futures-util = "0.3.30"

[[test]]
name = "cucumber_tests" # this should be the same as the filename of your test target
harness = false  # allows Cucumber to print output instead of libtest

[[test]]
name = "wallet_tests"
harness = false
